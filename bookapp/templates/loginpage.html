{% extends 'base.html' %}
{% load static %}

{% block title %}

    Registration Page

{% endblock %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"  href="static/css/loginpage.css">
</head>
<body>
<form method='POST'>
    {%csrf_token%}
    <div class="container-loginpage">
        <section class="login">
            <h2>Login Page</h2>
            
            <div class="Input">
                <input type="text" placeholder="Username" name="username">
            </div>
            <div class="Input">
                <input type="password" placeholder="Password" name="password1">
            </div>
            {% for message in messages %}
                <p>{{message}}</p>

            {% endfor %}
            <div class="Input">
                <button type="submit" value="Login" id="login_submit"> Login </button>
            </div>
            
            <div class="login-links">
                <a href="#"> Forgot Password?</a>
                <a href="{% url 'register_page'%}"> SignUp</a>

            </div>
        </section>
        </div>
</form>
</body>
</html>

{% endblock %}
