{% load static %}

<!DOCTYPE html>
<html lang="en" data-bs-theme =  >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Book Website{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark" style="margin: 20px;">
        <div class="container-fluid">
          <a class="navbar-brand" href="javascript:void(0)"><strong>Daniel Books</strong></a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mynavbar">
            <ul class="navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link" href="/book">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'all_books' %}">All Books</a>
              </li>
            </ul>
            <form class="d-flex" method="">
              <!-- <input class="form-control me-2" type="text" placeholder="Search"> -->
              {% csrf_token %}
              {{ search.name_of_book }}
              <button class="btn btn-primary m-2" type="subit" >Search</button>
            </form>
            <button class="btn btn-outline-success btn-sm m-2" type="button">Sign Up</button>
            <button class="btn btn-outline-success btn-sm m-2" type="button">Login</button>
          </div>
        </div>
      </nav>
<div class="container-fluid">
  <ul class="pagination pagination-sm justify-content-center">
    {% for category in categories %}
        <li class="page-item m-1">
          <a class="page-link" href="{% url 'category_detail' category.slug %}">
            {{ category.name }}
          </a>
        </li>
    {% endfor %}
  </ul> 
</div>
    {% block content %}

    {% endblock %}


    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
