{% extends 'base.html'%} 
{% load static %}

{% block title %}
    Book Site | {{ category.slug}}
{% endblock %}

{% block content %}
<div class="container">
    {% for book in category.books.all %}
            <div class="row">
            <a href="{% url 'book_detail' book.slug %}">
                    <div class="col-6 col-sm-4 col-md-4 col-lg-3 col-xl-2">
                        <img src="{{ book.cover_image.url }}" alt="book.name" class="img-fluid m-3">
                    </div>
                </a>
            </div>
    {% endfor %}
</div>

{% endblock %}
